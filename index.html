<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Piano Lockstep – Calibration</title>

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #container {
      position: relative;
      width: 640px;
      margin: auto;
    }

    #player {
      width: 640px;
      height: 390px;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 390px;
      cursor: crosshair;
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      color: #00ff99;
    }

    button {
      margin-top: 10px;
      padding: 10px 18px;
      font-size: 15px;
    }
  </style>
</head>

<body>

<h2>🎹 Piano Lockstep – Calibration</h2>

<div id="container">
  <div id="player"></div>
  <canvas id="overlay"></canvas>
</div>

<button onclick="resetCalibration()">Reset Calibration</button>

<div id="status">Click LEFTMOST piano key</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");

  let step = 0;
  const calibration = {};

  canvas.width = 640;
  canvas.height = 390;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: "IRJHv0o76u4",
      width: 640,
      height: 390,
      playerVars: { controls: 1 }
    });
  }

  canvas.addEventListener("click", e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (step === 0) {
      calibration.leftX = x;
      update("Click RIGHTMOST piano key");
    } 
    else if (step === 1) {
      calibration.rightX = x;
      update("Click HIT LINE (where bars touch keys)");
    } 
    else if (step === 2) {
      calibration.hitY = y;
      saveCalibration();
      update("✅ Calibration complete!");
      drawCalibration();
    }

    step++;
  });

  function drawCalibration() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "red";
    ctx.beginPath();
    ctx.moveTo(calibration.leftX, 0);
    ctx.lineTo(calibration.leftX, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(calibration.rightX, 0);
    ctx.lineTo(calibration.rightX, canvas.height);
    ctx.stroke();

    ctx.strokeStyle = "yellow";
    ctx.beginPath();
    ctx.moveTo(0, calibration.hitY);
    ctx.lineTo(canvas.width, calibration.hitY);
    ctx.stroke();
  }

  function saveCalibration() {
    localStorage.setItem("pianoCalibration", JSON.stringify(calibration));
  }

  function resetCalibration() {
    localStorage.removeItem("pianoCalibration");
    step = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    update("Click LEFTMOST piano key");
  }

  function update(msg) {
    document.getElementById("status").innerText = msg;
  }
</script>

</body>
</html>
