<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Piano Lockstep – Calibration (Fixed)</title>

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #container {
      position: relative;
      width: 640px;
      margin: auto;
    }

    #player iframe {
      width: 100%;
      height: 390px;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: auto;
      cursor: crosshair;
    }

    #status {
      margin-top: 12px;
      font-size: 18px;
      color: #00ff99;
    }

    button {
      margin-top: 10px;
      padding: 10px 18px;
      font-size: 15px;
    }
  </style>
</head>

<body>

<h2>🎹 Piano Lockstep – Calibration</h2>

<div id="container">
  <div id="player"></div>
  <canvas id="overlay"></canvas>
</div>

<button onclick="resetCalibration()">Reset Calibration</button>

<div id="status">Loading video…</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;
  let canvas, ctx;
  let step = 0;

  const calibration = {
    leftX: null,
    rightX: null,
    hitY: null
  };

  /* ======================
     YOUTUBE INIT
     ====================== */
  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: "IRJHv0o76u4",
      playerVars: { controls: 1 },
      events: {
        onReady: onPlayerReady
      }
    });
  }

  function onPlayerReady() {
    setupCanvas();
    loadCalibration();
    update("Click LEFTMOST piano key");
  }

  /* ======================
     CANVAS SETUP (FIXED)
     ====================== */
  function setupCanvas() {
    canvas = document.getElementById("overlay");
    ctx = canvas.getContext("2d");

    const iframe = document.querySelector("#player iframe");
    const rect = iframe.getBoundingClientRect();

    canvas.width = rect.width;
    canvas.height = rect.height;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    canvas.addEventListener("click", onCanvasClick);
  }

  function onCanvasClick(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (step === 0) {
      calibration.leftX = x;
      update("Click RIGHTMOST piano key");
    } else if (step === 1) {
      calibration.rightX = x;
      update("Click HIT LINE (where bars touch keys)");
    } else if (step === 2) {
      calibration.hitY = y;
      saveCalibration();
      drawCalibration();
      update("✅ Calibration complete");
    }

    step++;
  }

  /* ======================
     DRAWING
     ====================== */
  function drawCalibration() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "red";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(calibration.leftX, 0);
    ctx.lineTo(calibration.leftX, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(calibration.rightX, 0);
    ctx.lineTo(calibration.rightX, canvas.height);
    ctx.stroke();

    ctx.strokeStyle = "yellow";
    ctx.beginPath();
    ctx.moveTo(0, calibration.hitY);
    ctx.lineTo(canvas.width, calibration.hitY);
    ctx.stroke();
  }

  /* ======================
     STORAGE
     ====================== */
  function saveCalibration() {
    localStorage.setItem("pianoCalibration", JSON.stringify(calibration));
  }

  function loadCalibration() {
    const saved = localStorage.getItem("pianoCalibration");
    if (!saved) return;

    const data = JSON.parse(saved);
    Object.assign(calibration, data);
    step = 3;
    drawCalibration();
    update("✅ Calibration loaded");
  }

  function resetCalibration() {
    localStorage.removeItem("pianoCalibration");
    step = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    update("Click LEFTMOST piano key");
  }

  function update(msg) {
    document.getElementById("status").innerText = msg;
  }
</script>

</body>
</html>
