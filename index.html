<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Piano Lockstep (Guaranteed)</title>

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #player {
      margin-top: 20px;
    }
    button {
      margin-top: 15px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      font-size: 18px;
      color: #00ff99;
    }
  </style>
</head>

<body>

<h2>🎹 Piano YouTube Lockstep</h2>

<div id="player"></div>

<button onclick="startLearning()">▶ START LEARNING</button>

<div id="status">Click START to begin</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;
  let engineStarted = false;

  // VERY OBVIOUS PAUSE POINTS (for testing)
  const noteSequence = [
    { time: 5, note: 60 },
    { time: 8, note: 62 },
    { time: 11, note: 64 }
  ];

  let idx = 0;
  let waiting = false;
  let expectedNote = null;

  /* ======================
     YOUTUBE PLAYER
     ====================== */
  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      height: "390",
      width: "640",
      videoId: "IRJHv0o76u4",
      playerVars: {
        controls: 1,
        mute: 1   // 🔑 critical for autoplay reliability
      },
      events: {
        onReady: () => update("Player ready")
      }
    });
  }

  /* ======================
     USER START (MANDATORY)
     ====================== */
  function startLearning() {
    if (engineStarted) return;
    engineStarted = true;

    initMIDI();

    player.playVideo(); // user gesture → allowed
    update("▶ Playing…");

    setInterval(engineLoop, 50);
  }

  /* ======================
     AUTO-PAUSE ENGINE
     ====================== */
  function engineLoop() {
    if (!player || waiting) return;

    const t = player.getCurrentTime();
    const next = noteSequence[idx];
    if (!next) return;

    if (t >= next.time) {
      waiting = true;
      expectedNote = next.note;

      player.pauseVideo();
      update(`🎹 PLAY MIDI NOTE ${expectedNote}`);

      idx++;
    }
  }

  /* ======================
     MIDI INPUT
     ====================== */
  function initMIDI() {
    if (!navigator.requestMIDIAccess) {
      update("❌ Web MIDI not supported");
      return;
    }

    navigator.requestMIDIAccess().then(midi => {
      for (let input of midi.inputs.values()) {
        input.onmidimessage = onMIDI;
      }
      update("🎹 MIDI connected");
    });
  }

  function onMIDI(e) {
    const [status, note, velocity] = e.data;

    if (status === 144 && velocity > 0 && waiting) {
      if (note === expectedNote) {
        waiting = false;
        expectedNote = null;

        update("✅ Correct → continuing");
        player.playVideo();
      } else {
        update(`❌ Wrong note (${note})`);
      }
    }
  }

  function update(msg) {
    document.getElementById("status").innerText = msg;
    console.log(msg);
  }
</script>

</body>
</html>
