<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Piano YouTube Lockstep</title>

  <style>
    body {
      background: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #player {
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      color: #00ff99;
    }
  </style>
</head>

<body>

<h2>🎹 Piano YouTube Lockstep Learning</h2>

<div id="player"></div>
<div id="status">Loading…</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;

  /* ===============================
     NOTE SEQUENCE (EDIT THIS)
     =============================== */
  const noteSequence = [
    { time: 2.0, note: 64 }, // E
    { time: 3.0, note: 67 }, // G
    { time: 4.0, note: 69 }, // A
    { time: 5.0, note: 67 },
    { time: 6.0, note: 64 }
  ];

  let index = 0;
  let waitingForNote = false;
  let expectedNote = null;
  let videoStarted = false;

  /* ===============================
     YOUTUBE PLAYER
     =============================== */
  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      height: "390",
      width: "640",
      videoId: "IRJHv0o76u4",
      playerVars: { controls: 1 },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  }

  function onPlayerReady() {
    updateStatus("🎬 Press Play on the video");
    initMIDI();
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING && !videoStarted) {
      videoStarted = true;
      updateStatus("▶️ Video running...");
      startAutoPauseEngine();
    }
  }

  /* ===============================
     AUTO PAUSE ENGINE
     =============================== */
  function startAutoPauseEngine() {
    setInterval(() => {
      if (!player || waitingForNote) return;

      const currentTime = player.getCurrentTime();
      const next = noteSequence[index];
      if (!next) return;

      if (currentTime >= next.time) {
        expectedNote = next.note;
        waitingForNote = true;

        player.pauseVideo();
        updateStatus(`🎹 Play MIDI note ${expectedNote}`);
        index++;
      }
    }, 50);
  }

  /* ===============================
     MIDI INPUT
     =============================== */
  function initMIDI() {
    if (!navigator.requestMIDIAccess) {
      updateStatus("❌ Web MIDI not supported");
      return;
    }

    navigator.requestMIDIAccess().then(midi => {
      for (let input of midi.inputs.values()) {
        input.onmidimessage = onMIDIMessage;
      }
      updateStatus("🎹 MIDI connected. Press Play.");
    });
  }

  function onMIDIMessage(event) {
    const [status, note, velocity] = event.data;

    if (status === 144 && velocity > 0 && waitingForNote) {
      if (note === expectedNote) {
        waitingForNote = false;
        expectedNote = null;

        updateStatus("✅ Correct! Continuing...");
        player.playVideo();
      } else {
        updateStatus(`❌ Wrong note (${note}). Try again`);
      }
    }
  }

  function updateStatus(text) {
    document.getElementById("status").innerText = text;
  }
</script>

</body>
</html>
