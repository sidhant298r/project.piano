<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Piano YouTube Lockstep</title>

  <style>
    body {
      background: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin-top: 20px;
    }

    #player {
      margin-top: 20px;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      color: #00ff99;
    }
  </style>
</head>

<body>

<h2>🎹 Piano YouTube Lockstep Learning</h2>

<div id="player"></div>

<div id="status">Initializing…</div>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;

  // 🔹 DEFINE NOTE SEQUENCE (MVP)
  // time = seconds in video
  // note = MIDI note number
  const noteSequence = [
    { time: 1.5, note: 64 }, // E
    { time: 2.4, note: 67 }, // G
    { time: 3.2, note: 69 }, // A
    { time: 4.0, note: 67 }, // G
    { time: 4.8, note: 64 }  // E
  ];

  let currentIndex = 0;
  let waitingForNote = false;
  let expectedNote = null;

  // 🔹 YOUTUBE PLAYER INIT
  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      height: "390",
      width: "640",
      videoId: "IRJHv0o76u4", // your video
      playerVars: {
        controls: 1
      },
      events: {
        onReady: onPlayerReady
      }
    });
  }

  function onPlayerReady() {
    updateStatus("🎧 Video loaded. Waiting for MIDI…");
    player.pauseVideo();
    initMIDI();

    // ⏱️ Check video time every 50ms
    setInterval(checkVideoTime, 50);
  }

  // 🔹 AUTO-PAUSE ENGINE
  function checkVideoTime() {
    if (!player || waitingForNote) return;

    const currentTime = player.getCurrentTime();
    const nextEvent = noteSequence[currentIndex];

    if (!nextEvent) return;

    if (currentTime >= nextEvent.time) {
      expectedNote = nextEvent.note;
      waitingForNote = true;

      player.pauseVideo();
      updateStatus(`🎹 Play MIDI note: ${expectedNote}`);

      currentIndex++;
    }
  }

  // 🔹 MIDI HANDLING
  function initMIDI() {
    if (!navigator.requestMIDIAccess) {
      updateStatus("❌ Web MIDI not supported");
      return;
    }

    navigator.requestMIDIAccess().then(midi => {
      for (let input of midi.inputs.values()) {
        input.onmidimessage = onMIDIMessage;
      }
      updateStatus("🎹 MIDI connected. Press Play.");
    });
  }

  function onMIDIMessage(event) {
    const [status, note, velocity] = event.data;

    // NOTE ON
    if (status === 144 && velocity > 0 && waitingForNote) {
      if (note === expectedNote) {
        waitingForNote = false;
        expectedNote = null;

        updateStatus("✅ Correct! Continuing…");
        player.playVideo();
      } else {
        updateStatus(`❌ Wrong note (${note}). Try again.`);
      }
    }
  }

  // 🔹 STATUS HELPER
  function updateStatus(text) {
    document.getElementById("status").innerText = text;
  }
</script>

</body>
</html>
